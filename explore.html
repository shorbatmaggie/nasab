<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Explore a Text | Nasab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&family=Noto+Naskh+Arabic&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/inspector.css">

  
</head>

<body class="p-6 font-sans">

  <style>
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #F5F5F5;
    }
  
    body.dyslexic-mode {
      font-family: 'OpenDyslexic', sans-serif !important;
    }
  </style>

  <!-- Header -->
  <header class="p-6 rounded shadow">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-4xl font-bold tracking-wide">Nasab</h1>
      <p class="mt-1 text-lg not-italic">Explore a Text</p>
      </p>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="max-w-7xl mx-auto mt-4 mb-8 flex gap-4 text-lg font-semibold">
    <a href="index.html" class="underline">Home</a>
    <a href="compare.html" class="underline">Compare Texts</a>
    <a href="about.html" class="underline">About</a>
    <a href="more-tools.html" class="underline">More Tools</a>
    <label>
      <input type="checkbox" id="dyslexia-toggle" />
      Dyslexia-Friendly Font
    </label>
  </nav>


  <!-- Main Chart Area -->
 <main id="chart-area" class="max-w-7xl mx-auto"></main>

  <!-- Observable Runtime -->
  <script type="module">
    import define from "./js/ffexplore.js";
    import { Runtime, Inspector } from "./js/runtime.js";

    const runtime = new Runtime();
    const main = runtime.module(define, name => {
      if (name === undefined) return new Inspector(document.querySelector("#chart-area"));
    });

    document.getElementById("dyslexia-toggle").addEventListener("change", function () {
        document.body.classList.toggle("dyslexic-mode", this.checked);

        // 1. Update SVG <style> font-family
        const font = this.checked ? "'OpenDyslexic', sans-serif" : "'Noto Sans', sans-serif";
        document.querySelectorAll("#chart-area svg style").forEach(styleEl => {
          styleEl.textContent = styleEl.textContent.replace(
            /font-family:.*?;/,
            `font-family: ${font};`
          );
        });

        // 2. Remove/add .style.fontFamily on chart, svg, and <text> elements
        const chart = document.querySelector("#chart-area > div");
        if (chart) {
          chart.style.fontFamily = this.checked ? "'OpenDyslexic', sans-serif" : "";
          const svg = chart.querySelector("svg");
          if (svg) {
            svg.style.fontFamily = this.checked ? "'OpenDyslexic', sans-serif" : "";
            svg.querySelectorAll("text").forEach(el => {
              el.style.fontFamily = this.checked ? "'OpenDyslexic', sans-serif" : "";
            });
          }
        }
      });

  </script>

</body>

</html>
